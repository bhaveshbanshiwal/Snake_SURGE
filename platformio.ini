[platformio]
src_dir = src

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:receiver]
build_src_filter = -<*> +<esp32_st3215/platformio.cpp>
lib_deps =
    workloads/SCServo@1.0.1
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit NeoPixel@1.12.3

[env:transmitter]
build_src_filter = -<*> +<esp_now_transmitter/platformio.cpp>
