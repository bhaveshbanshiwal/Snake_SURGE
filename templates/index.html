<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake SURGE Web Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Top Nav / System Stats -->
        <header class="top-nav">
            <div class="logo">
                <h1>🐍 Snake SURGE</h1>
                <span class="badge">Web Control</span>
            </div>
            <div class="system-stats">
                <div class="stat-box">
                    <span class="label">CPU</span>
                    <span class="value" id="sys-cpu">--%</span>
                </div>
                <div class="stat-box">
                    <span class="label">RAM</span>
                    <span class="value" id="sys-ram">--%</span>
                </div>
                <div class="stat-box">
                    <span class="label">TEMP</span>
                    <span class="value temp" id="sys-temp">--°C</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Panel: Controls -->
            <aside class="control-panel">
                <section class="card">
                    <h2>Connection Engine</h2>
                    <div class="engine-selector">
                        <label>
                            <input type="radio" name="engine" value="DXL" checked>
                            Hardware (Dynamixel)
                        </label>
                        <label>
                            <input type="radio" name="engine" value="ESP">
                            Hardware (ESP32)
                        </label>
                        <label>
                            <input type="radio" name="engine" value="SIM">
                            Simulation (PyBullet)
                        </label>
                    </div>
                    
                    <button id="btn-connect" class="btn-primary">Connect Engine</button>
                    <div class="status-indicator">
                        <span class="dot" id="status-dot"></span>
                        <span id="conn-status">Disconnected</span>
                    </div>
                </section>

                <section class="card">
                    <h2>Mathematical Path</h2>
                    <div class="input-group">
                        <label>Function (y=)</label>
                        <input type="text" id="math-func" value="sin(x)">
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>From x=</label>
                            <input type="number" id="math-a" value="0">
                        </div>
                        <div class="input-group">
                            <label>To x=</label>
                            <input type="number" id="math-b" value="10">
                        </div>
                    </div>
                    <button id="btn-generate" class="btn-secondary">Generate Path</button>
                </section>

                <section class="card">
                    <h2>Manual Draw</h2>
                    <p class="help-text">Click and drag on the canvas to trace a custom path for the robot.</p>
                    <button id="btn-clear" class="btn-danger">Clear Canvas</button>
                </section>
            </aside>

            <!-- Center Panel: Canvas -->
            <main class="canvas-container card">
                <h2>Live Trajectory Tracking</h2>
                <div class="canvas-wrapper">
                    <canvas id="pathCanvas" width="700" height="500"></canvas>
                </div>
            </main>
        </div>
        
        <!-- Bottom Panel: Telemetry -->
        <footer class="telemetry-panel card">
            <h2>Actuator Telemetry</h2>
            <div class="telemetry-grid" id="telemetry-grid">
                <!-- Dynamically populated by JS -->
            </div>
        </footer>

        <!-- Accuracy Report Modal -->
        <div id="accuracy-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content card">
                <h2>Path Tracking Accuracy Report</h2>
                <div class="report-stats">
                    <div class="stat">
                        <span>Accuracy</span>
                        <span id="report-accuracy" class="value">--%</span>
                    </div>
                    <div class="stat">
                        <span>Avg Deviation</span>
                        <span id="report-deviation" class="value">-- m</span>
                    </div>
                </div>
                <div class="modal-canvas-wrapper">
                    <canvas id="reportCanvas" width="600" height="400"></canvas>
                </div>
                <button id="btn-close-modal" class="btn-primary">Close Report</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
